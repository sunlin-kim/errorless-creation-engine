name: android-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install JS deps
        run: npm ci

      - name: Verify web build (lint + typecheck + test + build)
        run: npm run verify

      - name: Build web bundle for Capacitor
        run: npm run build:capacitor

      - name: Generate launcher icons + splash (on-demand, not a dev dep)
        run: npx -y @capacitor/assets@3 generate --android || echo "icons already present"

      - name: cap sync android
        run: npx cap sync android

      - name: gradle assembleDebug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
